    <script>
      (function () {
        window.__bercaliDeferredInstallPrompt = null;
        window.__bercaliAppInstalled = false;
        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          window.__bercaliDeferredInstallPrompt = event;
          window.dispatchEvent(new CustomEvent('bercali:pwa-prompt-captured'));
        });
        window.addEventListener('appinstalled', function () {
          window.__bercaliAppInstalled = true;
          window.__bercaliDeferredInstallPrompt = null;
          window.dispatchEvent(new CustomEvent('bercali:pwa-installed'));
        });
      })();
    </script>
